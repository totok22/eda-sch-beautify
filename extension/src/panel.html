<!doctype html>
<html lang="zh-Hans" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>原理图美化导出</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f5;
    --card-bg: #ffffff;
    --card-border: #e4e4e7;
    --fg: #18181b;
    --muted: #71717a;
    --field-bg: #ffffff;
    --field-border: #d4d4d8;
    --field-fg: #18181b;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-light: #eff6ff;
    --accent-border: #bfdbfe;
    --btn-sec-bg: #ffffff;
    --btn-sec-border: #d4d4d8;
    --btn-sec-hover: #f4f4f5;
    --err: #dc2626;
    --tag-bg: #f4f4f5;
    --tag-border: #e4e4e7;
    --seg-active-bg: #ffffff;
    --chk1: #e9e9eb;
    --chk2: #fafafa;
    --sel-border: #2563eb;
    --sel-bg: rgba(37, 99, 235, 0.08);
    --toolbar-bg: rgba(255, 255, 255, 0.94);
    --toolbar-border: rgba(228, 228, 231, 0.85);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
  }
  html[data-theme=dark] {
    color-scheme: dark;
    --bg: #0f0f10;
    --card-bg: #19191a;
    --card-border: #2c2c2e;
    --fg: #eeeeef;
    --muted: #9a9a9e;
    --field-bg: #232325;
    --field-border: #3b3b3e;
    --field-fg: #eeeeef;
    --accent: #4d8df6;
    --accent-hover: #6ba0f8;
    --accent-light: rgba(77, 141, 246, 0.14);
    --accent-border: #3568b4;
    --btn-sec-bg: #232325;
    --btn-sec-border: #3b3b3e;
    --btn-sec-hover: #2c2c2f;
    --err: #ef5350;
    --tag-bg: #212123;
    --tag-border: #333336;
    --seg-active-bg: #36363a;
    --chk1: #222224;
    --chk2: #171719;
    --sel-border: #4d8df6;
    --sel-bg: rgba(77, 141, 246, 0.12);
    --toolbar-bg: rgba(25, 25, 26, 0.94);
    --toolbar-border: rgba(44, 44, 46, 0.9);
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme=light]) {
      color-scheme: dark;
      --bg: #0f0f10;
      --card-bg: #19191a;
      --card-border: #2c2c2e;
      --fg: #eeeeef;
      --muted: #9a9a9e;
      --field-bg: #232325;
      --field-border: #3b3b3e;
      --field-fg: #eeeeef;
      --accent: #4d8df6;
      --accent-hover: #6ba0f8;
      --accent-light: rgba(77, 141, 246, 0.14);
      --accent-border: #3568b4;
      --btn-sec-bg: #232325;
      --btn-sec-border: #3b3b3e;
      --btn-sec-hover: #2c2c2f;
      --err: #ef5350;
      --tag-bg: #212123;
      --tag-border: #333336;
      --seg-active-bg: #36363a;
      --chk1: #222224;
      --chk2: #171719;
      --sel-border: #4d8df6;
      --sel-bg: rgba(77, 141, 246, 0.12);
      --toolbar-bg: rgba(25, 25, 26, 0.94);
      --toolbar-border: rgba(44, 44, 46, 0.9);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* 顶部配置面板区 */
  .panel-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px;
    padding: 8px 10px 4px;
    flex-shrink: 0;
  }
  .card {
    min-width: 0;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 6px 10px;
    box-shadow: var(--shadow-sm);
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    min-width: 0;
    gap: 6px 10px;
  }
  .row-label {
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .row + .row {
    margin-top: 5px;
  }

  /* 输入控件与下拉菜单 */
  .field-group {
    display: inline-flex;
    align-items: center;
    min-width: 0;
    gap: 4px;
    font-size: 12px;
  }
  input[type=number], select {
    background: var(--field-bg);
    color: var(--field-fg);
    border: 1px solid var(--field-border);
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type=number]:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-light);
  }
  input[type=number] { width: 52px; text-align: center; }
  select { max-width: 100%; }
  option { background: var(--field-bg); color: var(--field-fg); }

  /* 胶囊复选框 (Checkbox Tag / Chip) */
  .chip-check {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    cursor: pointer;
    font-size: 11.5px;
    color: var(--fg);
    transition: all 0.15s;
  }
  .chip-check:hover {
    border-color: var(--accent-border);
    background: var(--accent-light);
  }
  .chip-check input[type=checkbox] {
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* 分段单选器 (Segmented Radio) */
  .segmented {
    display: inline-flex;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .segmented label {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    user-select: none;
  }
  .segmented label input[type=radio] { display: none; }
  .segmented label:has(input:checked) {
    background: var(--seg-active-bg);
    color: var(--fg);
    font-weight: 500;
    box-shadow: var(--shadow-sm);
  }
  .segmented.compact label { padding: 1px 7px; font-size: 11px; }

  /* 基础按钮 */
  button {
    font-family: inherit;
    font-size: 12px;
    border-radius: 5px;
    padding: 3px 9px;
    cursor: pointer;
    outline: none;
    transition: all 0.15s;
  }
  .btn-sec {
    background: var(--btn-sec-bg);
    color: var(--fg);
    border: 1px solid var(--btn-sec-border);
  }
  .btn-sec:hover {
    background: var(--btn-sec-hover);
    border-color: var(--muted);
  }
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    border: 1px solid transparent;
    font-weight: 500;
    box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
  }
  .btn-primary:hover {
    background: var(--accent-hover);
    box-shadow: 0 2px 5px rgba(37, 99, 235, 0.4);
  }

  /* 画布主体与浮动工具条 */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin: 4px 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    overflow: hidden;
    position: relative;
    background: var(--card-bg);
    min-height: 220px;
  }
  .floating-toolbar {
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 10px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--toolbar-bg); /* 不用 backdrop-filter：它盖在持续移动的画布上，每帧都要重新模糊 */
    border: 1px solid var(--toolbar-border);
    box-shadow: var(--shadow-md);
  }
  .tb-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tb-btn {
    background: var(--btn-sec-bg);
    border: 1px solid var(--btn-sec-border);
    color: var(--fg);
    padding: 2px 7px;
    font-size: 11px;
    border-radius: 4px;
    line-height: 1.3;
  }
  .tb-btn:hover { background: var(--btn-sec-hover); }
  .kbd-tip {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    margin-left: auto;
    gap: 3px;
  }
  .tb-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
  kbd {
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 10px;
    color: var(--fg);
  }

  /* 画布与缩放视口 */
  #wrap {
    position: relative;
    flex: 1;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: repeating-conic-gradient(var(--chk1) 0 25%, var(--chk2) 0 50%) 0 0 / 16px 16px;
    user-select: none;
    cursor: crosshair;
  }
  #wrap.pan-ready { cursor: grab; }
  #wrap.panning { cursor: grabbing; }
  #layer {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  /* 预览是栅格位图：#preview 全页底图，#previewHi 可视区高清细节层（同一坐标系，一起被 #layer 缩放） */
  #layer canvas {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    max-width: none;
    outline: 1px solid rgba(0, 0, 0, 0.12); /* 不用 box-shadow：大图层上的模糊阴影每次重绘都要算 */
  }
  #previewHi { visibility: hidden; }
  #selbox {
    position: absolute;
    border: 2px dashed var(--sel-border);
    background: var(--sel-bg);
    pointer-events: none;
    display: none;
    box-sizing: border-box;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6);
  }
  #selbox::after {
    content: '';
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 6px;
    height: 6px;
    background: var(--sel-border);
    border: 1px solid #ffffff;
  }

  /* 底部状态与操作栏 */
  .panel-footer {
    padding: 6px 10px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
    border-top: 1px solid var(--card-border);
    background: var(--card-bg);
  }
  .status-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }
  .status-main {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    flex-shrink: 0;
  }
  .dot.busy { background: #f59e0b; box-shadow: 0 0 6px rgba(245, 158, 11, 0.6); }
  .dot.err { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.6); }
  #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
  #stats {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 440px;
  }
  .actions-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  @media (max-width: 680px) {
    .panel-header { grid-template-columns: minmax(0, 1fr); }
    .kbd-tip { display: none; }
  }
</style>
</head>
<body>

<div class="panel-header">
  <!-- 美化参数卡片 -->
  <div class="card">
    <div class="card-title">跨线弧与美化参数</div>
    <div class="row">
      <div class="field-group">
        <span>跨线半径</span>
        <input id="radius" type="number" min="0" step="0.5" title="0 = 自动（3×线宽）">
        <span style="color:var(--muted);font-size:11px">(0=自动)</span>
      </div>
      <div class="field-group">
        <span>相近交叉</span>
        <select id="close">
          <option value="shrink">等大缩小</option>
          <option value="merge">合并长弧</option>
        </select>
      </div>
      <div class="field-group">
        <span>导出配色</span>
        <select id="etheme">
          <option value="Default">默认（跟随 EDA）</option>
          <option value="Black on White">白底黑线</option>
          <option value="White on Black">黑底白线</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:6px">
      <label class="chip-check"><input id="jc" type="checkbox">节点随导线颜色</label>
      <label class="chip-check"><input id="rm" type="checkbox">清理未连接标记</label>
      <label class="chip-check"><input id="font" type="checkbox">中文宋体 / 英文衬线</label>
    </div>
  </div>

  <!-- 导出选项卡片 -->
  <div class="card">
    <div class="card-title">导出区域与输出格式</div>
    <div class="row">
      <span class="row-label">导出范围:</span>
      <div class="segmented">
        <label><input type="radio" name="region" value="page">整页</label>
        <label><input type="radio" name="region" value="selection">选中图元</label>
        <label><input type="radio" name="region" value="manual" id="rManual">手动框选</label>
      </div>
      <button id="btnSel" type="button" class="btn-sec" style="padding:1px 6px;font-size:11px">读取选中</button>
    </div>
    <div class="row" style="margin-top:6px">
      <div class="field-group">
        <span title="仅“选中图元”导出时生效">边距</span>
        <input id="margin" type="number" min="0" step="5" style="width:44px">
      </div>
      <div class="field-group">
        <span>PNG 倍率</span>
        <div class="segmented compact">
          <label title="1x 标清"><input type="radio" name="scale" value="1">1x</label>
          <label title="2x 高清"><input type="radio" name="scale" value="2">2x</label>
          <label title="4x 超清"><input type="radio" name="scale" value="4">4x</label>
          <label title="6x 极致（超大图受浏览器画布上限影响会自动降采样）"><input type="radio" name="scale" value="6">6x</label>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:6px">
      <div class="field-group" style="flex:1 1 100%">
        <span>背景底色</span>
        <div class="segmented compact">
          <label title="KiCad 纸色 #F5F4EF"><input type="radio" name="bg" value="paper">纸色</label>
          <label title="纯白 #FFFFFF"><input type="radio" name="bg" value="white">白</label>
          <label title="浅灰 #F2F2F2"><input type="radio" name="bg" value="lightgray">浅灰</label>
          <label title="深灰 #1E1E1E"><input type="radio" name="bg" value="darkgray">深灰</label>
          <label title="纯黑 #000000"><input type="radio" name="bg" value="black">黑</label>
          <label title="完全透明（无底色）"><input type="radio" name="bg" value="transparent">透明</label>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 交互画板视口 -->
<div class="viewport-wrapper">
  <div class="floating-toolbar">
    <div class="tb-group">
      <button id="zOut" class="tb-btn" title="缩小">−</button>
      <span id="zoomLabel" style="min-width:40px;text-align:center;font-size:11px;font-weight:600">100%</span>
      <button id="zIn" class="tb-btn" title="放大">+</button>
      <button id="zFit" class="tb-btn">适应</button>
      <button id="z100" class="tb-btn">100%</button>
      <span style="height:12px;width:1px;background:var(--card-border);margin:0 4px"></span>
      <div class="field-group">
        <span class="tb-label">拖动</span>
        <div class="segmented compact">
          <label title="左键拖动画框，自动切到“手动框选”"><input type="radio" name="dragMode" value="select">框选</label>
          <label title="左键拖动平移；空格或中键随时可用"><input type="radio" name="dragMode" value="pan">平移</label>
        </div>
      </div>
    </div>
    <div class="kbd-tip" title="按住 Ctrl 或 ⌘ 再左键拖动，可临时切到框选">
      <kbd>滚轮</kbd> 缩放 · <kbd>空格</kbd>/中键平移 · <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+拖动框选
    </div>
  </div>

  <div id="wrap">
    <div id="layer">
      <canvas id="preview"></canvas>
      <canvas id="previewHi"></canvas>
    </div>
    <div id="selbox"></div>
  </div>
</div>

<!-- 底部控制与状态栏 -->
<div class="panel-footer">
  <div class="status-block">
    <div class="status-main">
      <span class="dot" id="statusDot"></span>
      <span id="status">正在加载原理图…</span>
    </div>
    <div id="stats"></div>
  </div>
  <div class="actions-group">
    <button id="btnReload" class="btn-sec" type="button" title="从当前原理图重新抓取最新图页">重新读取图页</button>
    <button id="btnSvg" class="btn-sec" type="button">导出 SVG</button>
    <button id="btnPng" class="btn-primary" type="button">导出 PNG 图片</button>
  </div>
</div>

<script src="panel.js"></script>
</body>
</html>
